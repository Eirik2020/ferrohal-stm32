# How reqtool reads this repository. Requirements sit beside the layer that sets
# them, and the benches under hil/ are the boards evidence is recorded against.
name = "ferrohal-stm32"
requirements = "src/requirements"
roots = "requirements/goals.md"
root_prefix = "G"
evidence = "requirements/evidence/runs"
artifacts = "requirements/evidence/logs"
boards = "hil"
test_features = [["stm32f401re"], ["stm32f405rg"], ["stm32h743vi"], ["stm32h753zi"]]
# Every library file owes tracing; the bench crates under hil/ do not.
every_file_traced = true
every_file_traced_except = ["hil"]
