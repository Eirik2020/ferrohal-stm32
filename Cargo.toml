[package]
name = "ferrohal-stm32"
version = "0.1.0"
edition = "2024"
description = "A scheduler-agnostic STM32 HAL on stm32-metapac: RTIC-first, never RTIC-only."
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# Every dependency is pinned exactly: a bump needs a reviewed diff analysis or
# reverification. Metapac's pin also fixes the metadata the hand-written routing
# tables were checked against.
stm32-metapac = { version = "=21.0.0", default-features = false, features = ["pac"] }
cortex-m = "=0.7.10"
cortex-m-rt = { version = "=0.7.7", optional = true }
embedded-hal = "=1.0.0"
embedded-io = "=0.7.1"
defmt = { version = "=1.2.0", optional = true }
# Conversions only; FerroHAL's own API never takes fugit types.
fugit = { version = "=0.6.0", optional = true }
# The USB device stack FerroWasp already uses. Third-party, and not free of
# panics, so it stays behind a feature.
usb-device = { version = "=0.3.2", optional = true }
synopsys-usb-otg = { version = "=0.4.0", default-features = false, features = ["cortex-m"], optional = true }

[features]
default = []

# The full-speed USB OTG port, as a `usb-device` bus.
usb = ["dep:usb-device", "dep:synopsys-usb-otg"]

# The vector table and the svd2rust-shaped device module RTIC needs. The
# backend turns this on; nothing else should enable metapac's `rt`.
#
# `set-vtor` comes with it: the F4's ROM bootloader leaves for the application by
# jumping, with no reset, so VTOR would still point at the ROM and an interrupt
# would run the ROM's handler. The Foxeer's USB failed to enumerate that way.
rt = ["stm32-metapac/rt", "dep:cortex-m-rt", "cortex-m-rt/set-vtor"]
# RTIC's `peripherals = true` names `Peripherals::steal()`, so the item exists
# only with this feature. Nothing else turns it on: a safe `steal` would alias
# one peripheral twice, and `take()` is the safe path. Safety policy,
# exception 1.
rtic = ["rt"]
defmt = ["dep:defmt", "stm32-metapac/defmt"]
# `From` conversions between `time::Hertz` and fugit 0.6's `HertzU32`, the
# fugit rtic-monotonics 3 uses.
fugit = ["dep:fugit"]

# Vendor > family > chip > IP version. A chip names its family and every IP
# version it carries; the IP modules compile only behind their own feature.
_vendor-st = []
_family-stm32f4 = ["_vendor-st"]
_family-stm32h7 = ["_vendor-st"]

# IP versions. Each needs an RCC module and, for the UART, a stream DMA;
# the chip feature supplies them.
usart_v2 = []
usart_v4 = []
spi_v2 = []
spi_v4 = []
i2c_v1 = []
i2c_v2 = []
exti_v1 = []
exti_h7 = []
timer_v1 = []
timer_v3 = []
iwdg_v1 = []
iwdg_v2 = []
dma_v1 = []
dma_v2 = []
gpio_v2 = []
rcc_f4 = []
rcc_h7rm0433 = []
adc_v2 = []
adc_v4 = []
sdmmc_v2 = []

# Chip features are metapac's chip names, passed straight through.
stm32f401re = [
    "stm32-metapac/stm32f401re",
    "_family-stm32f4",
    "usart_v2",
    "spi_v2",
    "i2c_v1",
    "exti_v1",
    "timer_v1",
    "iwdg_v1",
    "synopsys-usb-otg?/fs",
    "dma_v2",
    "gpio_v2",
    "rcc_f4",
    "adc_v2",
]
stm32f405rg = [
    "stm32-metapac/stm32f405rg",
    "_family-stm32f4",
    "usart_v2",
    "spi_v2",
    "i2c_v1",
    "exti_v1",
    "timer_v1",
    "iwdg_v1",
    "synopsys-usb-otg?/fs",
    "dma_v2",
    "gpio_v2",
    "rcc_f4",
    "adc_v2",
]
stm32h743vi = [
    "stm32-metapac/stm32h743vi",
    "_family-stm32h7",
    "usart_v4",
    "spi_v4",
    "i2c_v2",
    "exti_h7",
    "timer_v3",
    "iwdg_v2",
    "synopsys-usb-otg?/hs",
    "dma_v1",
    "gpio_v2",
    "rcc_h7rm0433",
    "adc_v4",
    "sdmmc_v2",
]
stm32h753zi = [
    "stm32-metapac/stm32h753zi",
    "_family-stm32h7",
    "usart_v4",
    "spi_v4",
    "i2c_v2",
    "exti_h7",
    "timer_v3",
    "iwdg_v2",
    "synopsys-usb-otg?/hs",
    "dma_v1",
    "gpio_v2",
    "rcc_h7rm0433",
    "adc_v4",
    "sdmmc_v2",
]

[package.metadata.docs.rs]
features = ["stm32f401re", "rt"]
default-target = "thumbv7em-none-eabihf"
[workspace]
