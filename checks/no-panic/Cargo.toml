[package]
name = "ferrohal-no-panic"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "ferrohal-no-panic"
path = "src/main.rs"
test = false
bench = false

[dependencies]
ferrohal-stm32 = { path = "../..", features = ["rt", "fugit", "usb"] }
fugit = "0.6"
embedded-io = "0.7.1"
embedded-hal = "1.0.0"
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.6"

[features]
stm32f401re = ["ferrohal-stm32/stm32f401re"]
stm32f405rg = ["ferrohal-stm32/stm32f405rg"]
stm32h743vi = ["ferrohal-stm32/stm32h743vi"]
stm32h753zi = ["ferrohal-stm32/stm32h753zi"]
# Links despite panic paths, to find them in the disassembly.
locate = []

# The firmware profile: the check proves what ships.
[profile.release]
codegen-units = 1
debug = 2
lto = true
opt-level = "s"

[workspace]
