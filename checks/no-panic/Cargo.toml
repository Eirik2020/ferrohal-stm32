[package]
name = "ferrohal-no-panic"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "ferrohal-no-panic"
path = "src/main.rs"
test = false
bench = false

[dependencies]
# `usb` comes with each chip that has a USB port (not the F410).
ferrohal-stm32 = { path = "../..", features = ["rt", "fugit", "rtic"] }
fugit = "0.6"
embedded-io = "0.7.1"
embedded-hal = "1.0.0"
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.6"

[features]
stm32f401re = ["ferrohal-stm32/stm32f401re", "ferrohal-stm32/usb"]
stm32f410rb = ["ferrohal-stm32/stm32f410rb"]
stm32f411ce = ["ferrohal-stm32/stm32f411ce", "ferrohal-stm32/usb"]
stm32f405rg = ["ferrohal-stm32/stm32f405rg", "ferrohal-stm32/usb"]
stm32f407vg = ["ferrohal-stm32/stm32f407vg", "ferrohal-stm32/usb"]
stm32f412zg = ["ferrohal-stm32/stm32f412zg", "ferrohal-stm32/usb"]
stm32f413zh = ["ferrohal-stm32/stm32f413zh", "ferrohal-stm32/usb"]
stm32f427vi = ["ferrohal-stm32/stm32f427vi", "ferrohal-stm32/usb"]
stm32f429zi = ["ferrohal-stm32/stm32f429zi", "ferrohal-stm32/usb"]
stm32f446re = ["ferrohal-stm32/stm32f446re", "ferrohal-stm32/usb"]
stm32f722re = ["ferrohal-stm32/stm32f722re", "ferrohal-stm32/usb"]
stm32f745vg = ["ferrohal-stm32/stm32f745vg", "ferrohal-stm32/usb"]
stm32f767zi = ["ferrohal-stm32/stm32f767zi", "ferrohal-stm32/usb"]
stm32h743vi = ["ferrohal-stm32/stm32h743vi", "ferrohal-stm32/usb"]
stm32h753zi = ["ferrohal-stm32/stm32h753zi", "ferrohal-stm32/usb"]
# Links despite panic paths, to find them in the disassembly.
locate = []

# The firmware profile: the check proves what ships.
[profile.release]
codegen-units = 1
debug = 2
lto = true
opt-level = "s"

[workspace]
