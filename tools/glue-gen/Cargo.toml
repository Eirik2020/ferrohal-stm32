# The chip-glue generator (ADR-008, docs/design/glue-generator.md). A host
# tool: never published, never a dependency of the library. Its own workspace,
# as every package under hil/ and checks/ is.
[package]
name = "glue-gen"
version = "0.1.0"
edition = "2024"
publish = false
description = "Generates FerroHAL's chip glue from stm32-metapac's metadata."

[dependencies]
glue-model = { path = "model" }
# The glue probe (plan step 5) talks to the board through the debugger. The
# merge gate regenerates without it (`--no-default-features`).
probe-rs = { version = "=0.32.0", optional = true }
serde_json = "=1.0.150"

[features]
default = ["probe"]
probe = ["dep:probe-rs"]

[workspace]
members = [".", "model", "dump"]
resolver = "3"
