name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FIRMWARE_TARGET: thumbv7em-none-eabihf
  # The toolchain the benches and checks have been running on.
  RUST_TOOLCHAIN: 1.98.1
  # reqtool after #9 (2026-11-17): board evidence follows files (#4, #5), host
  # evidence covers every cfg alternative (#6), as do imports and `super` (#8),
  # board tiers (#7), and a configuration no longer records which binary cargo
  # built last (#9), and a `#[path]` file owns its own directory, as rustc
  # treats it (#10, for ADR-012's `timer/`). Bump it on purpose.
  REQTOOL_REV: fd264172989820eab7a2a933fcaa9c8ce4cc1803

jobs:
  # A pull request that adds a decision label outside docs/decisions/ fails here
  # (docs/decisions/AGENTS.md, rule 1). The job keeps one comment on the pull
  # request, found by its hidden marker line, listing the flagged lines and the
  # prose that may be a reworded label. The comment is edited, never deleted, so
  # a label reworded away stays in front of the owner. A fork's token cannot
  # write comments: there the check still fails, with the lines in the job log.
  decision-labels:
    name: Decision labels
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # One run per PR at a time, so two quick pushes cannot both create a comment.
    concurrency:
      group: decision-labels-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      BASE_REF: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The tool diffs against the merge base of origin/<base> and HEAD, so
          # it needs the history back to the branch point.
          fetch-depth: 0

      - name: Update the decision-label comment
        # A fork's token cannot write comments; the next step still gates.
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          # This job's own comment: the bot's, opening with the marker. Filtering
          # by author means a marker pasted by anyone else is never read or edited.
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]"
                    and (.body | startswith("<!-- decision-labels -->"))) | .id' | head -n1)
          : > previous.md
          if [ -n "$id" ]; then
            gh api "repos/$REPO/issues/comments/$id" --jq .body > previous.md
          fi

          status=0
          python3 -I tools/check_decision_labels.py --diff "origin/$BASE_REF" \
            --markdown --previous previous.md > body.md || status=$?
          # 0: nothing flagged now; 1: labels flagged. Anything else is a tool or
          # git error: fail here rather than post a misleading comment.
          if [ "$status" -gt 1 ]; then exit "$status"; fi

          # An empty body means nothing was ever flagged on this PR: post nothing.
          if [ ! -s body.md ]; then exit 0; fi
          if [ -n "$id" ]; then
            # Edited in place, also when the check now passes: never deleted.
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -F body=@body.md > /dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@body.md > /dev/null
          fi

      - name: Decision labels on added lines
        # The gate: prints each flagged line and the rule, exits 1 on any.
        run: python3 -I tools/check_decision_labels.py --diff "origin/$BASE_REF"

  glue:
    name: Generated glue
    # The merge gate (ADR-008): pull requests into main, and pushes to main.
    # A pull request's caches are its own; only main's are shared, so main
    # runs it too, or every pull request would start cold.
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      # Depth 2: a pull request checks out its merge commit, whose first
      # parent is main, so HEAD^1..HEAD is exactly what it changes.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      # The gate's inputs. The glue reads the generator, src/chips and the
      # lockfiles; the tier tables read `reqtool check`, which hashes every
      # library file under src/, the requirements and evidence, and builds the
      # bench crates under hil/ (not the rig's own files at hil/'s top level;
      # hil/COVERAGE.md is an output). A pull request touching none of them is
      # skipped; it still regenerates every chip when it touches any.
      - name: Does this change touch the gate's inputs?
        id: inputs
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          touched=$(git diff --name-only HEAD^1 HEAD -- \
            .github/workflows/ci.yml tools/glue-gate.sh tools/glue-gen \
            Cargo.toml Cargo.lock .cargo reqtool.toml \
            src requirements docs/CHIPS.md hil/COVERAGE.md
            git diff --name-only HEAD^1 HEAD -- hil ':(exclude,glob)hil/*')
          if [ -n "$touched" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            printf 'inputs touched:\n%s\n' "$touched"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "skip  no gate input changed; main's last run stands"
          fi
      - name: Install Rust toolchain
        if: steps.inputs.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ env.FIRMWARE_TARGET }}
          components: rustfmt
      # Also the root and bench builds `reqtool check` makes for the tiers,
      # and the installed reqtool.
      - name: Cache Cargo
        if: steps.inputs.outputs.run == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            tools/glue-gen -> target
            . -> target
            hil/foxeer-f405-v2 -> target
            hil/lucid-h7 -> target
            hil/nucleo-f401re-loopback -> target
            hil/nucleo-h753zi-loopback -> target
            hil/stm32f4-discovery -> target
      # Each part's metapac dump, under a key glue-gen checks per part
      # (`dump_key`), so a stale entry is redumped, never read. Every chip is
      # still emitted and compared.
      - name: Cache the per-part metapac dumps
        if: steps.inputs.outputs.run == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/glue-dumps
          key: glue-dumps-${{ hashFiles('tools/glue-gen/Cargo.lock', 'tools/glue-gen/dump/**', 'tools/glue-gen/model/**') }}
          restore-keys: glue-dumps-
      # The tier tables come from reqtool's evidence; reqtool builds the bench
      # configurations to judge it, hence the firmware target.
      - name: Install reqtool at its pinned revision
        if: steps.inputs.outputs.run == 'true'
        run: >
          cargo install --git https://github.com/Eirik2020/reqtool
          --rev "$REQTOOL_REV" --locked
      - name: Regenerate the glue and the tables, fail on any difference
        if: steps.inputs.outputs.run == 'true'
        env:
          GLUE_DUMP_CACHE: ${{ runner.temp }}/glue-dumps
        run: tools/glue-gate.sh

  checks:
    name: Checks without hardware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ env.FIRMWARE_TARGET }}
          components: clippy,rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            checks/no-panic -> target
            examples/nucleo-f401re -> target
            examples/nucleo-h753zi -> target

      # The crate only: the bench and check packages under hil/ and checks/
      # are their own workspaces, and are not formatted.
      - name: Check formatting
        run: cargo fmt --check

      - name: Run every check that needs no hardware, for every chip
        run: checks/run.sh

  benches:
    name: Bench crate ${{ matrix.crate }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        crate:
          - foxeer-f405-v2
          - lucid-h7
          - nucleo-f401re-loopback
          - nucleo-h753zi-loopback
          - stm32f4-discovery
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ env.FIRMWARE_TARGET }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.crate }}
          workspaces: hil/${{ matrix.crate }} -> target

      # From the crate's own directory, so its .cargo/config.toml selects the
      # target and linker scripts, and its manifest's features the chip. The
      # release profile is the one the bench scripts flash.
      - name: Build every bench binary for its chip
        working-directory: hil/${{ matrix.crate }}
        run: cargo build --release --locked --bins

  requirements:
    name: Requirements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      # Also keeps the installed reqtool, which cargo install then reuses
      # while its revision is unchanged.
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install reqtool at its pinned revision
        run: >
          cargo install --git https://github.com/Eirik2020/reqtool
          --rev "$REQTOOL_REV" --locked

      - name: Validate requirements and evidence
        run: reqtool validate

  publication-security:
    name: Publication security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output /tmp/gitleaks.tar.gz
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            /tmp/gitleaks.tar.gz | sha256sum --check --strict
          tar --extract --gzip --file /tmp/gitleaks.tar.gz \
            --directory /tmp gitleaks
          /tmp/gitleaks version

      - name: Scan complete reachable Git history
        run: >
          /tmp/gitleaks git
          --no-banner
          --redact
          --max-archive-depth 1
          --log-opts=--all
          .
