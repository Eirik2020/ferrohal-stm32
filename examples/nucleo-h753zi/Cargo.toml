[package]
name = "nucleo-h753zi-examples"
version = "0.1.0"
edition = "2024"
publish = false
description = "FerroHAL examples for the Nucleo-H753ZI: one small program per driver."

# One binary per driver. `cargo run --release --bin <name>` builds, flashes
# and prints its log over the ST-LINK (probe-rs, `.cargo/config.toml`).

[[bin]]
name = "usb-serial"
path = "src/bin/usb_serial.rs"
test = false
bench = false

[dependencies]
# `rt` gives cortex-m-rt its vector table and sets VTOR at reset; every
# firmware linking FerroHAL turns it on (tools/check_firmware_features.py).
# `usb` brings the USB device port, and with it a third-party stack that can
# panic, which is why it is a feature of its own.
ferrohal-stm32 = { path = "../..", features = ["stm32h753zi", "rt", "defmt", "usb"] }
usbd-serial = "0.2.2"

cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.6"

defmt = "1.0.1"
defmt-rtt = "1.3.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = true
opt-level = "s"

# Not part of any workspace around it.
[workspace]
