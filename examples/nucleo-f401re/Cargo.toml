[package]
name = "nucleo-f401re-examples"
version = "0.1.0"
edition = "2024"
publish = false
description = "FerroHAL examples for the Nucleo-F401RE: one small program per driver."

# One binary per driver. `cargo run --release --bin <name>` builds, flashes
# and prints its log over the ST-LINK (probe-rs, `.cargo/config.toml`).

[[bin]]
name = "blinky"
path = "src/bin/blinky.rs"
test = false
bench = false

[[bin]]
name = "pwm-fade"
path = "src/bin/pwm_fade.rs"
test = false
bench = false

[[bin]]
name = "adc-read"
path = "src/bin/adc_read.rs"
test = false
bench = false

[[bin]]
name = "spi-loopback"
path = "src/bin/spi_loopback.rs"
test = false
bench = false

[[bin]]
name = "i2c-scan"
path = "src/bin/i2c_scan.rs"
test = false
bench = false

[[bin]]
name = "uart-echo"
path = "src/bin/uart_echo.rs"
test = false
bench = false

[[bin]]
name = "rtic-uart-echo"
path = "src/bin/rtic_uart_echo.rs"
test = false
bench = false

[dependencies]
# `rt` gives cortex-m-rt its vector table and sets VTOR at reset; every
# firmware linking FerroHAL turns it on (tools/check_firmware_features.py).
# `rtic` adds what RTIC's `peripherals = true` names, for rtic-uart-echo.
ferrohal-stm32 = { path = "../..", features = ["stm32f401re", "rt", "rtic", "defmt"] }
embedded-hal = "1.0.0"
embedded-io = "0.7.1"

cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.6"
rtic = { version = "2.4.0", features = ["thumbv7-backend"] }

defmt = "1.0.1"
defmt-rtt = "1.3.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = true
opt-level = "s"

# Not part of any workspace around it.
[workspace]
