schema_version: 2
requirements:
  - id: RCC-001
    title: A clock tree is checked before it is used
    statement: >-
      A clock configuration shall be checked against the chip's limits
      before it is applied.
    rationale: >-
      A clock past its limit can run unreliably with no visible failure.
    derived_from: [G2]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferrohal_stm32::chip::tests::validate_accepts_168_mhz_from_an_8_mhz_crystal
        - level: unit
          environment: host
          method:
            test: ferrohal_stm32::chip::tests::spi123_needs_pll1q

  - id: RCC-002
    title: The clocks are what they report
    statement: >-
      The clocks the driver reports shall be the clocks the chip runs at.
    rationale: >-
      Every baud rate, timer and SPI clock is computed from them.
    derived_from: [G3]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Timers on the Nucleo-F401RE
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Timers on the Nucleo-H753ZI

  - id: RCC-003
    title: The regulator scale suits the clocks
    statement: >-
      When a clock configuration uses the PLL, the driver shall set the
      regulator voltage scale that the chip's clock limits assume, never a
      reserved value, and see the regulator report ready before the system
      runs from the PLL.
    rationale: >-
      A bootloader can leave a lower scale, under which the chip's highest
      clocks run out of specification with no visible failure.
    derived_from: [RCC-001]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Die 0x413 on the STM32F4 Discovery
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Timers on the Nucleo-F401RE
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Timers on the Nucleo-H753ZI

  - id: RCC-004
    title: The over-drive follows HCLK
    statement: >-
      On a chip with a regulator over-drive, the driver shall run the
      regulator in over-drive exactly when the configuration's HCLK is above
      the chip's over-drive threshold, entering it before the system runs
      from the PLL.
    rationale: >-
      Above that threshold (180 MHz on the F7, 168 MHz on the F446) the chip
      runs out of specification without the over-drive (DS11853 Table 16,
      DS10916 Table 18, DS10693 Table 16), and the over-drive's higher APB
      limits hold only while it is on.
    derived_from: [RCC-003]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferrohal_stm32::chip::tests::solve_gives_216_mhz_and_usb_in_overdrive
        - level: unit
          environment: host
          method:
            test: ferrohal_stm32::chip::tests::at_180_mhz_the_overdrive_stays_off_and_the_apbs_drop
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#SPI on the Nucleo-F767ZI
