schema_version: 2
requirements:
  - id: USB-001
    title: USB carries CDC serial
    statement: >-
      The USB port shall enumerate as a CDC serial device and echo what the
      host sends, polled or from its interrupt.
    rationale: >-
      A board with no debug probe is configured over USB.
    derived_from: [G3]
    verification:
      entries: []
