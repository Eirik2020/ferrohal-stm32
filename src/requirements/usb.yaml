schema_version: 2
requirements:
  - id: USB-001
    title: USB carries CDC serial
    statement: >-
      The USB port shall enumerate as a CDC serial device and echo what the
      host sends, polled or from its interrupt.
    rationale: >-
      A board with no debug probe is configured over USB. Proven on the H7's
      OTG_HS core at full speed; the F4's OTG_FS core is different IP behind
      the same driver, and USB-F4-001 owes its own proof.
    derived_from: [G3]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#USB on the Nucleo-H753ZI

  - id: USB-F4-001
    title: On the F4, the OTG_FS core carries CDC serial
    statement: >-
      On the F4, the OTG_FS core shall enumerate as a CDC serial device and
      echo what the host sends, polled or from its interrupt.
    rationale: >-
      The F4's USB core is different IP from the H7's, behind the same
      driver, so it needs its own proof. No Nucleo here has an F4 USB
      connector; the STM32F4 Discovery's CN5 is the F4's.
    derived_from: [USB-001]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#USB on the STM32F4 Discovery

  - id: USB-002
    title: A deferred USB vector carries CDC serial under its rule of use
    statement: >-
      With its vector deferred, and the vector's service and every bus call
      kept from preempting one another, the OTG_FS port shall enumerate as a
      CDC serial device and echo what the host sends.
    rationale: >-
      A firmware serves the USB core from a task. The transmit FIFO erratum
      (ES0182 2.14.1 and its twins) corrupts the FIFO when another core
      access cuts into a write to it, and the deferred vector's service is
      one. Excluding them by a lock costs less than masking every interrupt.
    derived_from: [USB-F4-001]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Deferred USB on the STM32F4 Discovery
