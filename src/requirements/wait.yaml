schema_version: 2
requirements:
  - id: WAIT-M4-001
    title: A counted bound is never short on the Cortex-M4
    statement: >-
      On the Cortex-M4, a wait counted in loop passes shall never end sooner
      than the bound asked for.
    rationale: >-
      A wait that ends early reports a failure that did not happen. A loop
      pass costs a different number of cycles on each core, and the floors
      the count is built on are measured per core, so each core has its own
      requirement.
    derived_from: [G2]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#UART on the Nucleo-F401RE

