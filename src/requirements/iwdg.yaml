schema_version: 2
requirements:
  - id: IWDG-001
    title: A fed watchdog does not reset
    statement: >-
      A watchdog fed within its timeout shall not reset the chip.
    rationale: >-
      Firmware running normally must keep running.
    derived_from: [G3]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Watchdog on the Nucleo-F401RE
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Watchdog on the Nucleo-H753ZI

  - id: IWDG-002
    title: A starved watchdog resets the chip
    statement: >-
      A watchdog not fed shall reset the chip, within the spread its clock
      allows.
    rationale: >-
      This is the whole purpose of a watchdog.
    derived_from: [G2]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Watchdog on the Nucleo-F401RE
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Watchdog on the Nucleo-H753ZI

  - id: IWDG-003
    title: The prescaler is the finest that fits
    statement: >-
      The watchdog shall use the finest prescaler that reaches its timeout.
    rationale: >-
      A finer prescaler keeps the timeout closest to what was asked.
    derived_from: [G3]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferrohal_stm32::iwdg_v1::tests::divider_picks_the_finest_prescaler

  - id: IWDG-004
    title: A halted core does not starve the watchdog
    statement: >-
      A watchdog started by this crate shall be frozen while a debugger
      holds the core halted.
    rationale: >-
      A breakpoint must not reset the chip under the debugger.
    derived_from: [G3]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Watchdog on the Nucleo-F401RE
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Watchdog on the Nucleo-H753ZI

  - id: IWDG-005
    title: A feed before the window opens resets
    statement: >-
      A watchdog started with a window shall reset the chip if fed before
      the window opens.
    rationale: >-
      A window catches firmware that feeds in a loop without doing its work.
    derived_from: [G3]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Watchdog on the Nucleo-H753ZI
        - level: unit
          environment: host
          method:
            test: ferrohal_stm32::iwdg_v2::tests::window_is_inside_the_timeout

  - id: IWDG-006
    title: A measured LSI sets the timeout
    statement: >-
      A watchdog started with a measured LSI frequency shall scale its
      prescaler and reload to that frequency.
    rationale: >-
      The LSI varies from chip to chip; a board constant keeps the timeout
      near what was asked.
    derived_from: [G3]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Watchdog on the Nucleo-F401RE
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Watchdog on the Nucleo-H753ZI
        - level: unit
          environment: host
          method:
            test: ferrohal_stm32::iwdg_v1::tests::divider_follows_the_lsi
