schema_version: 2
requirements:
  - id: RESET-001
    title: The reset cause is reported
    statement: >-
      The driver shall report whether the last reset came from software or
      the watchdog, and a fresh start as neither.
    rationale: >-
      Firmware decides what to do from why it restarted.
    derived_from: [G3]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Watchdog on the Nucleo-F401RE
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Watchdog on the Nucleo-H753ZI
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Bootloader request on the Nucleo-F401RE
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Bootloader request on the Nucleo-H753ZI

  - id: RESET-002
    title: A bootloader request survives the reset
    statement: >-
      A bootloader request shall survive the reset it causes.
    rationale: >-
      A lost request leaves the board running instead of ready to flash.
    derived_from: [G2]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Bootloader request on the Nucleo-F401RE

  - id: RESETH7-001
    title: On the H7, a bootloader request survives the cache and the ECC
    statement: >-
      On the H7, a bootloader request shall survive the reset it causes with
      the data cache on, written as whole doublewords that the SRAM's ECC
      keeps across the reset.
    rationale: >-
      Only the H7 has a data cache that can hold the request back from RAM,
      and SRAM whose ECC drops an incomplete doubleword across a reset
      (RM0433 2.4); the F4 has neither, so this part is the H7's own.
    derived_from: [RESET-002]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Bootloader request on the Nucleo-H753ZI

  - id: RESET-003
    title: A bootloader request answers once
    statement: >-
      A bootloader request shall read as set once, and a fresh boot as not
      set.
    rationale: >-
      A stuck request would send the board to its ROM on every boot.
    derived_from: [G2]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Bootloader request on the Nucleo-F401RE

  - id: RESET-004
    title: The ROM bootloader is reached
    statement: >-
      A firmware asking for the ROM bootloader shall arrive in it, able to
      flash.
    rationale: >-
      A firmware with no way back to the ROM can strand a board with no
      probe.
    derived_from: [G3]
    verification:
      entries: []

  - id: SIG-001
    title: The unique ID is readable
    statement: >-
      The driver shall read the chip's factory unique ID.
    rationale: >-
      Boards identify themselves by it.
    derived_from: [G3]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#ADC on the Nucleo-F401RE
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#ADC on the Nucleo-H753ZI

  - id: SIG-002
    title: The die revision is readable
    statement: >-
      The driver shall read the chip's die revision code from its family's
      DBGMCU, IDCODE on the F4 and IDC on the H7.
    rationale: >-
      ES0392 2.2.10 and 2.2.21 depend on the silicon revision, so a board must
      know which part it carries. Each family's glue reads its own register
      at its own address, so each family needs its own proof.
    derived_from: [G3]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#ADC on the Nucleo-F401RE
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#ADC on the Nucleo-H753ZI

