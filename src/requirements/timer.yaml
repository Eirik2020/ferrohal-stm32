schema_version: 2
requirements:
  - id: TIMER-001
    title: A tick runs at its rate
    statement: >-
      A tick shall interrupt at its configured rate, to 0.05 percent of the
      cycle counter.
    rationale: >-
      A scheduler or watchdog runs from this.
    derived_from: [G3]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Timers on the Nucleo-F401RE
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Timers on the Nucleo-H753ZI

  - id: TIMER-002
    title: A tick can be paused
    statement: >-
      A paused tick shall raise no interrupts until it runs again.
    rationale: >-
      Firmware has to be able to stop one without tearing it down.
    derived_from: [G1]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Timers on the Nucleo-F401RE
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Timers on the Nucleo-H753ZI

  - id: TIMER-003
    title: A timebase counts at its frequency
    statement: >-
      A timebase shall count at its configured frequency, to 0.01 percent of
      the cycle counter.
    rationale: >-
      Timestamps are only as good as this count.
    derived_from: [G3]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Timers on the Nucleo-F401RE
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Timers on the Nucleo-H753ZI

  - id: TIMER-004
    title: A rate that cannot be exact is refused
    statement: >-
      A timer rate the clock does not divide exactly shall be refused, not
      rounded.
    rationale: >-
      A tick that drifts is worse than one that will not build.
    derived_from: [G2]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferrohal_stm32::timer_v1::tests::divider_is_exact_or_refuses

  - id: TIMER-005
    title: A tick can see its vector is enabled
    statement: >-
      A tick shall report whether its update vector is enabled at one
      priority.
    rationale: >-
      The caller binds vectors, so a missing one should show at start, not
      as silence.
    derived_from: [G1]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Timers on the Nucleo-F401RE
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Timers on the Nucleo-H753ZI

  - id: PWM-001
    title: A channel's duty is as set
    statement: >-
      A PWM channel shall output its duty as set, to one sixteenth of the
      period.
    rationale: >-
      Servos and other outputs depend on it.
    derived_from: [G3]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Timers on the Nucleo-F401RE
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Timers on the Nucleo-H753ZI

  - id: PWM-002
    title: A lane sends its values one period apart
    statement: >-
      A compare lane shall put out each of its values for one period, in
      order.
    rationale: >-
      This is what a DShot frame is on the wire.
    derived_from: [G3]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Timers on the Nucleo-F401RE
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Timers on the Nucleo-H753ZI

  - id: PWM-003
    title: Lanes and sampler keep up at the rate
    statement: >-
      Two lanes and a sampler shall all finish, at the rate a DShot600 frame
      needs, with no sample lost.
    rationale: >-
      Bidirectional DShot sends and samples at once.
    derived_from: [G3]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Timers on the Nucleo-F401RE
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Timers on the Nucleo-H753ZI

  - id: PWM-004
    title: A slave timer waits for its master
    statement: >-
      A timer set as a slave shall not count until its master starts it.
    rationale: >-
      Lanes on two timers have to begin together.
    derived_from: [G3]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Timers on the Nucleo-F401RE
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Timers on the Nucleo-H753ZI

  - id: PWM-005
    title: Linked timers begin together
    statement: >-
      A master's start shall start its slave in the same timer clock, on
      every start.
    rationale: >-
      Motor outputs on two timers would otherwise be skewed.
    derived_from: [G3]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Timers on the Nucleo-F401RE
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Timers on the Nucleo-H753ZI

  - id: PWM-006
    title: A rounded rate is reported
    statement: >-
      A PWM rate that must round shall use the nearest and report what it
      got.
    rationale: >-
      PWM rates are rarely exact, and a caller needs to know the real one.
    derived_from: [G3]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferrohal_stm32::timer_v1::pwm::tests::nearest_rounds_and_reports

  - id: AWG-001
    title: Each lane plays its own samples
    statement: >-
      Each lane of a waveform generator shall play its own samples in order,
      one for each timer period.
    rationale: >-
      A protocol or a signal is whatever its samples say, so the samples
      must reach the pin as given.
    derived_from: [PWM-002]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Timers on the Nucleo-F401RE
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Timers on the Nucleo-H753ZI

  - id: AWG-002
    title: One start plays every loaded lane
    statement: >-
      One start shall play every loaded lane, and leave a lane with nothing
      loaded low.
    rationale: >-
      Outputs that belong together must begin together, and an unused one
      must stay quiet.
    derived_from: [PWM-005]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Timers on the Nucleo-F401RE
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Timers on the Nucleo-H753ZI

  - id: AWG-003
    title: A waveform ends low
    statement: >-
      A waveform shall end with its output low until the next one.
    rationale: >-
      A line left high after a waveform would read as signal.
    derived_from: [G2]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Timers on the Nucleo-F401RE
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Timers on the Nucleo-H753ZI

  - id: AWG-004
    title: The generator refuses what it cannot do
    statement: >-
      The generator shall refuse a lane it does not have, a load or play
      while playing, and a play with nothing loaded.
    rationale: >-
      Overlapping a running waveform would corrupt it, so it cannot be left
      to the caller.
    derived_from: [G2]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Timers on the Nucleo-F401RE
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Timers on the Nucleo-H753ZI


  - id: AWG-007
    title: An abort leaves the generator ready
    statement: >-
      An abort shall stop every lane at duty 0 and leave the generator ready
      to load again.
    rationale: >-
      A fault must not leave an output driven, or the generator stuck.
    derived_from: [G2]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Timers on the Nucleo-F401RE
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Timers on the Nucleo-H753ZI

  - id: AWG-005
    title: Two timers play together
    statement: >-
      A generator on two timers shall finish every lane's waveform, started
      by trigger or in software.
    rationale: >-
      Boards spread their outputs over timers, and not every pair has a
      trigger route.
    derived_from: [AWG-002]
    verification:
      entries:
        - level: target
          environment: product
          method:
            procedure: requirements/benches.md#The Foxeer F405 V2 board bench
        - level: target
          environment: product
          method:
            procedure: requirements/benches.md#The TBS Lucid H7 board bench

  - id: AWG-006
    title: Each channel opens its own request
    statement: >-
      Each lane shall open only its own channel's compare request.
    rationale: >-
      A request opened with no waveform behind it would disturb its channel.
    derived_from: [AWG-002]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferrohal_stm32::timer_v1::awg::tests::each_channel_has_its_own_request_bit

  - id: AWG-008
    title: A waveform crosses a wire intact
    statement: >-
      Samples played on one pin shall be recovered from the far end of a
      wire, each within one sixteenth of full scale.
    rationale: >-
      Reading a pin's own register cannot show the signal left the chip.
    derived_from: [AWG-001]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Timers on the Nucleo-F401RE
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Timers on the Nucleo-H753ZI

  - id: AWG-009
    title: A lane reads on the pin it sends on
    statement: >-
      A lane that releases its pin shall read a waveform arriving on it,
      each sample within one sixteenth of full scale, then send again.
    rationale: >-
      A bidirectional protocol answers on the wire it was sent on.
    derived_from: [AWG-008]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Timers on the Nucleo-F401RE
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Timers on the Nucleo-H753ZI

  - id: AWG-010
    title: Samples are recovered from captures
    statement: >-
      Recovering samples from captures shall give each sample's active share
      of its period, for either polarity, with a zero between samples
      reading as zero.
    rationale: >-
      This is how a waveform read back is compared with what was sent.
    derived_from: [G3]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferrohal_stm32::timer_v1::awg::tests::samples_come_back_as_sent
        - level: unit
          environment: host
          method:
            test: ferrohal_stm32::timer_v1::awg::tests::a_zero_between_samples_reads_as_zero
        - level: unit
          environment: host
          method:
            test: ferrohal_stm32::timer_v1::awg::tests::active_low_reads_the_low_part_as_the_pulse
        - level: unit
          environment: host
          method:
            test: ferrohal_stm32::timer_v1::awg::tests::other_pins_change_nothing
        - level: unit
          environment: host
          method:
            test: ferrohal_stm32::timer_v1::awg::tests::a_line_active_at_the_start_waits_for_its_next_edge
        - level: unit
          environment: host
          method:
            test: ferrohal_stm32::timer_v1::awg::tests::a_fraction_of_a_capture_per_sample_stays_in_step
        - level: unit
          environment: host
          method:
            test: ferrohal_stm32::timer_v1::awg::tests::nothing_to_read_gives_nothing
        - level: unit
          environment: host
          method:
            test: ferrohal_stm32::timer_v1::awg::tests::it_stops_at_the_end_of_out

  - id: AWG-011
    title: An output turned off sends nothing
    statement: >-
      With a lane's output off, a waveform played on it shall not reach its
      pin.
    rationale: >-
      Listening depends on a released pin staying released.
    derived_from: [AWG-009]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Timers on the Nucleo-F401RE
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Timers on the Nucleo-H753ZI

  - id: AWG-012
    title: Flight board routes can read
    statement: >-
      Every lane on a flight board's motor routes shall read its pad's port
      over DMA.
    rationale: >-
      Each board reaches its pads by different timers, streams and ports.
    derived_from: [AWG-009]
    verification:
      entries:
        - level: target
          environment: product
          method:
            procedure: requirements/benches.md#The Foxeer F405 V2 board bench
        - level: target
          environment: product
          method:
            procedure: requirements/benches.md#The TBS Lucid H7 board bench
