schema_version: 2
requirements:
  - id: I2C-001
    title: The I2C has one API on every chip
    statement: >-
      Firmware shall reach the same I2C driver API, by the same name,
      whatever I2C version its chip has.
    rationale: >-
      A single unified HAL: code above the driver must not change when the
      chip does. Reaching one API is a property of the build, so an analysis
      of one source built for every chip proves it, not a bench.
    derived_from: [G3]
    verification:
      entries:
        - level: analysis
          environment: host
          method:
            procedure: requirements/benches-analysis.md#One I2C API on every chip

  - id: I2C-002
    title: A start that cannot run is refused
    statement: >-
      A speed the IP version cannot carry, or a kernel clock it cannot time
      from, shall be refused, with the wiring handed back.
    rationale: >-
      Starting anyway could break a device; a refusal that keeps its tokens
      lets the firmware try another bus.
    derived_from: [G2]
    verification:
      entries:
        - level: target
          environment: development
          part: i2c
          method:
            procedure: requirements/benches.md#I2C on the Nucleo-F401RE
        - level: target
          environment: development
          part: i2c
          method:
            procedure: requirements/benches.md#I2C on the Nucleo-H753ZI

  - id: I2C-003
    title: Every wait is bounded and a stuck one recovers
    statement: >-
      Every transfer shall finish within a bound of twice its wire time plus
      a margin, or be stopped and the bus put back, so the next transfer
      can start.
    rationale: >-
      An unbounded wait has no place in a control loop, and a stuck bus
      must not take the I2C with it.
    derived_from: [G2]
    verification:
      entries:
        - level: target
          environment: development
          part: i2c
          method:
            procedure: requirements/benches.md#I2C on the Nucleo-F401RE
        - level: target
          environment: development
          part: i2c
          method:
            procedure: requirements/benches.md#I2C on the Nucleo-H753ZI

  - id: I2C-004
    title: An unanswered address is reported and recovered from
    statement: >-
      An address no device acknowledges shall be reported as a NACK, its flag
      cleared, and the bus put back, so the next transfer runs.
    rationale: >-
      A vacant or broken device is a condition firmware measures, not a
      hang; the bus must not go down with it.
    derived_from: [G2]
    verification:
      entries:
        - level: target
          environment: development
          part: i2c
          method:
            procedure: requirements/benches.md#I2C on the Nucleo-F401RE
        - level: target
          environment: development
          part: i2c
          method:
            procedure: requirements/benches.md#I2C on the Nucleo-H753ZI

  - id: I2C-005
    title: The timing registers make the speed asked for
    statement: >-
      The timing registers each IP version computes shall land at or below
      the speed asked for, never above it, with the rate the driver reports
      the one those registers make.
    rationale: >-
      Devices have a maximum SCL, and firmware checks against what the
      driver reports.
    derived_from: [G3]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferrohal_stm32::i2c_v1::tests::the_manuals_example_timing
        - level: unit
          environment: host
          method:
            test: ferrohal_stm32::i2c_v1::tests::fast_mode_from_the_boards_pclk1
        - level: unit
          environment: host
          method:
            test: ferrohal_stm32::i2c_v2::tests::every_mode_from_the_bench_pclk1
        - level: unit
          environment: host
          method:
            test: ferrohal_stm32::i2c_v2::tests::the_counts_meet_the_specification

  - id: I2C-006
    title: The transaction contract holds across both IP versions
    statement: >-
      The embedded-hal transaction shall be carried with adjacent
      operations of one kind as one segment, a repeated start between
      segments, and a stop after the last, on every IP version.
    rationale: >-
      The device drivers above take that contract; a wrong start or stop
      position loses their bytes.
    derived_from: [G3]
    verification:
      entries:
        - level: target
          environment: development
          part: i2c
          method:
            procedure: requirements/benches.md#I2C on the Nucleo-F401RE
        - level: target
          environment: development
          part: i2c
          method:
            procedure: requirements/benches.md#I2C on the Nucleo-H753ZI

  - id: I2C-007
    title: A transaction starts without waiting and its end is reported
    statement: >-
      The interrupt-driven driver shall start a transaction of a write, a
      read, or a write then a read joined by a repeated start, to one
      7-bit address, and return at once, its end reported by the
      interrupt service with every lent buffer handed back.
    rationale: >-
      A control loop cannot spend the wire time of an I2C transfer in a busy
      wait; the buffers coming back with the end keep their ownership
      with the caller.
    derived_from: [G1]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Interrupt-driven I2C on the Nucleo-F401RE

  - id: I2C-008
    title: Each phase moves by DMA from the IP version's threshold up
    statement: >-
      A phase at least its IP version's threshold long shall move its bytes by
      DMA when the wiring has channels, and every other phase from the
      event interrupt.
    rationale: >-
      The bench measured a channel's cost flat in length and the interrupt's
      per byte; below the crossover the interrupt costs the CPU less.
    derived_from: [I2C-007]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Interrupt-driven I2C on the Nucleo-F401RE

  - id: I2C-009
    title: A transaction that cannot run is refused before the bus moves
    statement: >-
      A start while one runs, a phase empty, longer than its buffer or than
      255 bytes, an address past 7 bits, or a DMA buffer the channel
      cannot reach shall be refused with the transaction handed back and
      nothing put on the bus.
    rationale: >-
      A refusal that keeps the buffers lets the caller retry; a channel pointed
      at memory it cannot reach would fault or read stale cache.
    derived_from: [G2]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Interrupt-driven I2C on the Nucleo-F401RE

  - id: I2C-010
    title: A failed transaction ends with its fault and the bus put back
    statement: >-
      A NACK, lost arbitration, an overrun or a channel fault shall end the
      transaction with that fault and its buffers, the flags cleared, so
      the next transaction runs.
    rationale: >-
      A vacant or misbehaving device is a condition the firmware measures, not
      a hang; the bus must not go down with it.
    derived_from: [G2]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Interrupt-driven I2C on the Nucleo-F401RE

  - id: I2C-011
    title: An aborted transaction hands its buffers back and the bus recovers
    statement: >-
      An abort shall end the running transaction as aborted with its buffers,
      and leave the bus so the next transaction runs.
    rationale: >-
      A slave may stretch SCL without limit and the driver has no timer, so
      the caller's bound ends it; a bus left held would take every later
      transfer with it.
    derived_from: [G2]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Interrupt-driven I2C on the Nucleo-F401RE

  - id: I2C-012
    title: An interrupt-driven open that cannot run is refused
    statement: >-
      An open with a speed or kernel clock the IP version cannot time, or a
      channel an earlier owner left running, shall be refused with the
      wiring handed back.
    rationale: >-
      Starting anyway could break a device or point a running channel at new
      memory; the wiring kept lets the firmware try another route.
    derived_from: [G2]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Interrupt-driven I2C on the Nucleo-F401RE

  - id: I2C-013
    title: The interrupt-driven driver counts what happened
    statement: >-
      The interrupt-driven driver shall count completed, NACKed, faulted,
      aborted and refused transactions, bus errors, channel faults, and
      phases by DMA and by interrupt, from its open.
    rationale: >-
      Health monitoring reads the counts; a bus error the errata say to carry
      on through is only visible there.
    derived_from: [G4]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Interrupt-driven I2C on the Nucleo-F401RE

  - id: I2C-V1-001
    title: I2C v1 clears its event flags in the manual's sequences
    statement: >-
      I2C v1 shall walk its events as RM0368 §27.3.3 sequences them: the
      address byte at SB, the one- and two-byte receive arming at ADDR, the
      receive tail's NACK and stop while taking the last byte, and a write
      segment's stop at BTF.
    rationale: >-
      The events stretch SCL until their software sequence is done, so the
      sequences are also the only order that never stalls the bus.
    derived_from: [I2C-006]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#I2C on the Nucleo-F401RE

  - id: I2C-V1-002
    title: I2C v1 moves a phase by DMA as the manual sequences it
    statement: >-
      I2C v1 shall move a DMA phase with DMAEN and ITBUFEN off, a receive with
      LAST and its stop at the channel's transfer complete, a write's
      stop at BTF after DMAEN drops, and a one-byte receive from the
      event interrupt.
    rationale: >-
      RM0368 18.3.8: the NACK of a one-byte receive is programmed at EV6,
      before DMA could end it, and ITBUFEN with DMA raises the byte
      events twice.
    derived_from: [I2C-008]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Interrupt-driven I2C on the Nucleo-F401RE

  - id: I2C-V1-003
    title: I2C v1 recovers an aborted transaction
    statement: >-
      I2C v1 shall end an aborted transaction with a STOP and reset the
      peripheral once the bus is free.
    rationale: >-
      The STOP tells a slave mid-transfer the transaction is over; without it
      the slave keeps the bus.
    derived_from: [I2C-011]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Interrupt-driven I2C on the Nucleo-F401RE

  - id: I2C-V2-001
    title: I2C v2 carries its transfers in CR2 programs
    statement: >-
      I2C v2 shall carry a segment as CR2 programs it: NBYTES with RELOAD
      across chunks at TCR, AUTOEND on the last segment, and the repeated
      start through the next program's START, with the flags cleared
      through ICR.
    rationale: >-
      CR2 is the transfer's own counter; a wrong NBYTES or a missing
      AUTOEND leaves the bus stretched or without its stop.
    derived_from: [I2C-006]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#I2C on the Nucleo-H753ZI
