schema_version: 2
requirements:
  - id: RCC-001
    title: A clock tree is checked before it is used
    statement: >-
      A clock configuration shall be checked against the chip's limits
      before it is applied.
    rationale: >-
      A clock past its limit can run unreliably with no visible failure.
    derived_from: [G2]
    verification:
      entries:
        - level: unit
          environment: host
          method:
            test: ferrohal_stm32::chip::tests::foxeer_clocks_validate
        - level: unit
          environment: host
          method:
            test: ferrohal_stm32::chip::tests::spi123_needs_pll1q

  - id: RCC-002
    title: The clocks are what they report
    statement: >-
      The clocks the driver reports shall be the clocks the chip runs at.
    rationale: >-
      Every baud rate, timer and SPI clock is computed from them.
    derived_from: [G3]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Timers on the Nucleo-F401RE
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Timers on the Nucleo-H753ZI

  - id: RCC-003
    title: The regulator scale suits the clocks
    statement: >-
      When a clock configuration uses the PLL, the driver shall set the
      regulator voltage scale that the chip's clock limits assume, never a
      reserved value, and see the regulator report ready before the system
      runs from the PLL.
    rationale: >-
      A bootloader can leave a lower scale, under which the chip's highest
      clocks run out of specification with no visible failure.
    derived_from: [RCC-001]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#Timers on the Nucleo-F401RE

  - id: GPIO-001
    title: Pins carry what they are set to
    statement: >-
      A pin shall carry the signal its mode and alternate function select.
    rationale: >-
      Every driver reaches the outside through this.
    derived_from: [G3]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#SPI and EXTI on the Nucleo-F401RE

  - id: DMA-001
    title: Streams move what they are set to
    statement: >-
      A DMA stream shall move data for the peripheral request it is set to.
    rationale: >-
      Every DMA driver depends on it.
    derived_from: [G3]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#UART on the Nucleo-F401RE
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#UART on the Nucleo-H753ZI

  - id: WAIT-001
    title: A counted bound is never short, on either core
    statement: >-
      On each core FerroHAL runs on, the F4's Cortex-M4 and the H7's
      Cortex-M7, a wait counted in loop passes shall never end sooner than
      the bound asked for.
    rationale: >-
      A wait that ends early reports a failure that did not happen. A loop
      pass costs a different number of cycles on each core, and the floors
      the count is built on are measured per core, so each core needs its
      own proof.
    derived_from: [G2]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#UART on the Nucleo-F401RE
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#UART on the Nucleo-H753ZI

  - id: RES-001
    title: A driver can see its vectors are enabled
    statement: >-
      A driver shall report whether the vectors it needs are enabled at one
      priority.
    rationale: >-
      The caller binds vectors, so a missing one should show at start, not
      as silence.
    derived_from: [G1]
    verification:
      entries:
        - level: target
          environment: development
          method:
            procedure: requirements/benches.md#UART on the Nucleo-F401RE
