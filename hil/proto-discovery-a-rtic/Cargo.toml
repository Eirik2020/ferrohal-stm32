# PROTOTYPE (audit step 6, candidate A with RTIC): an RTIC bench whose checks
# are embedded-test tests. RTIC keeps `main`; idle calls embedded-test's entry
# through its internal `_ariel` feature, which stops it exporting `main` and a
# panic handler. Never requirement evidence.
[package]
name = "proto-discovery-a-rtic"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
harness = false
test = false

[[test]]
name = "route"
harness = false

[features]
hang-clocks = []
hang-check = []

[dependencies]
ferrohal-stm32 = { path = "../..", features = ["stm32f407vg", "rt", "defmt", "rtic"] }
stm32-metapac = { version = "=21.0.0", default-features = false, features = ["stm32f407vg"] }
embedded-io = "0.7.1"
embedded-hal = "1.0.0"
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.6"
cortex-m-semihosting = "0.5.0"
semihosting = "=0.1.25"
critical-section = "1.2"
rtic = { version = "2.4.0", features = ["thumbv7-backend"] }
defmt = "1.0.1"
defmt-rtt = "1.3.0"

[dev-dependencies]
embedded-test = { version = "=0.7.3", default-features = false, features = ["semihosting", "defmt", "_ariel"] }

[profile.release]
codegen-units = 1
debug = 2
lto = true
opt-level = "s"

[workspace]
