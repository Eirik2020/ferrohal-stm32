[package]
name = "lucid-h7"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "lucid-h7"
path = "src/main.rs"
test = false
bench = false

[[bin]]
name = "usb-irq"
path = "src/bin/usb_irq.rs"
test = false
bench = false

[dependencies]
ferrohal-stm32 = { path = "../..", features = ["stm32h743vi", "rt", "usb"] }
usbd-serial = "0.2.2"
embedded-hal = "1.0.0"

cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.6"
rtic = { version = "2.4.0", features = ["thumbv7-backend"] }

[profile.release]
codegen-units = 1
debug = 2
lto = true
opt-level = "s"

# Not part of any workspace around it.
[workspace]
