path = "src/bin/spi_polled.rs"
test = false
bench = false

[[bin]]
name = "usb-cdc"
path = "src/bin/usb_cdc.rs"
test = false
bench = false

[[bin]]
name = "bootloader-request"
path = "src/bin/bootloader_request.rs"
test = false
bench = false

[[bin]]
name = "adc"
path = "src/bin/adc.rs"
test = false
bench = false

[[bin]]
name = "timer-trigger"
path = "src/bin/timer_trigger.rs"
test = false
bench = false

[[bin]]
name = "awg-both-ways"
path = "src/bin/awg_both_ways.rs"
test = false
bench = false

[[bin]]
name = "i2c-master"
path = "src/bin/i2c_master.rs"
