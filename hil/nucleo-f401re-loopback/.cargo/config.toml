[build]
target = "thumbv7em-none-eabihf"

[target.thumbv7em-none-eabihf]
runner = "probe-rs run --chip STM32F401RE --probe 0483:374b"
rustflags = [
    "-C", "link-arg=--nmagic",
    "-C", "link-arg=-L.",
    "-C", "link-arg=-Tlink.x",
    "-C", "link-arg=-Tdefmt.x",
]

[env]
DEFMT_LOG = "info"
# Room for a whole run's report: a run can finish before probe-rs attaches,
# and the default 1 KiB would drop its first lines.
DEFMT_RTT_BUFFER_SIZE = "4096"
