[dependencies]
ferrohal-stm32 = { path = "../..", features = ["stm32f401re", "rt", "defmt", "rtic", "usb"] }
# Safe reads of registers the checks inspect (PWR, USART SR). FerroHAL's pin;
# FerroHAL already turns this chip on.
stm32-metapac = { version = "=21.0.0", default-features = false, features = ["stm32f401re"] }
embedded-io = "0.7.1"
embedded-hal = "1.0.0"

cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.6"
cortex-m-semihosting = "0.5.0"
rtic = { version = "2.4.0", features = ["thumbv7-backend"] }

defmt = "1.0.1"
defmt-rtt = "1.3.0"
panic-probe = { version = "1.0.0", features = ["print-defmt"] }

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
lto = true
opt-level = "s"

# Not part of any workspace around it.
[workspace]
